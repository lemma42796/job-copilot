# JD 抽取回归 — promptfoo 配置(M1 S6 MVP)
# 文档:docs/6-EVAL_PLAN.md §3
description: JD extract regression (jd_parser/v1.0.1)

# 不走 apps/api 的 LLMClient,直接打 DashScope OpenAI 兼容模式 → 评测纯 prompt 质量
providers:
  - id: openai:chat:qwen3.6-flash
    label: qwen3.6-flash@dashscope
    config:
      apiBaseUrl: https://dashscope.aliyuncs.com/compatible-mode/v1
      apiKeyEnvar: DASHSCOPE_API_KEY_EVAL
      temperature: 0
      seed: 42
      max_tokens: 2048
      response_format:
        type: json_object
      # qwen3.6-flash 默认开启深度思考,DashScope 把 reasoning 拼进 content,
      # 加上 max_tokens=2048 不够 thinking + JSON 总输出 → schema_invalid。
      # 生产 JDParser 走 CHEAP tier(thinking_mode=False),评测对齐。
      # promptfoo openai provider 用 passthrough 透传非标准字段到 body 顶层。
      passthrough:
        enable_thinking: false
      # 不传 top_p / cache_control / stream — 见 EVAL_PLAN §3.2 + DashScope 文档

# Prompt 来自后端真实模板 v1.0.0.j2,loader 拆 SYSTEM/USER + 渲染 jd_text
prompts:
  - file://./prompt.ts

# 每条样本都跑 4 个断言;dataset.jsonl 提供 vars(jd_text + expected)
defaultTest:
  assert:
    - type: javascript
      value: file://./assertions.ts:titleExact
    - type: javascript
      value: file://./assertions.ts:hardSkillF1
    - type: javascript
      value: file://./assertions.ts:salaryMatch
    - type: javascript
      value: file://./assertions.ts:salaryMonthsAcc

tests: file://./dataset.jsonl

# 输出位置(promptfoo 把 outputPath 解释为相对 CWD,不是相对 config;
# `pnpm run eval:jd` 的 CWD = evals/,所以这里写 `reports/...` → evals/reports/)
outputPath: reports/jd_extract/latest.json
