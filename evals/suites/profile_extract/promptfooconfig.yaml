# Profile 抽取回归 — promptfoo 配置(M1 S10 baseline)
# 文档:docs/6-EVAL_PLAN.md §4
description: Profile extract regression (profile_parser/v1.0.0)

# 不走 apps/api 的 LLMClient,直接打 DashScope OpenAI 兼容模式 → 评测纯 prompt 质量
providers:
  - id: openai:chat:qwen3.6-flash
    label: qwen3.6-flash@dashscope
    config:
      apiBaseUrl: https://dashscope.aliyuncs.com/compatible-mode/v1
      apiKeyEnvar: DASHSCOPE_API_KEY_EVAL
      temperature: 0
      seed: 42
      # 简历比 JD 长,输出嵌套结构(experiences/projects/skills/educations)更大,
      # 给到 4096 留余量;jd_extract 用的 2048 在 10+ 段经历的简历会截尾。
      max_tokens: 4096
      response_format:
        type: json_object
      # 评测对齐生产 CHEAP tier(thinking_mode=False),否则 reasoning 拼进 content
      # 截 max_tokens → schema_invalid。详见 STATUS 永久约束 #12。
      passthrough:
        enable_thinking: false

# Prompt 来自后端真实模板 v1.0.0.j2,loader 拆 SYSTEM/USER + 渲染 resume_text + 拼 schema
prompts:
  - file://./prompt.ts

# 每条样本跑 4 个断言;dataset.jsonl 提供 vars(resume_text + expected)
defaultTest:
  assert:
    - type: javascript
      value: file://./assertions.ts:schemaValid
    - type: javascript
      value: file://./assertions.ts:experienceRecall
    - type: javascript
      value: file://./assertions.ts:skillF1
    - type: javascript
      value: file://./assertions.ts:chunkRecall

tests: file://./dataset.jsonl

# 输出位置(promptfoo 把 outputPath 解释为相对 CWD = evals/)
outputPath: reports/profile_extract/latest.json
