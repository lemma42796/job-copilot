name: Docker Smoke

on:
  workflow_dispatch:

concurrency:
  group: docker-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-up:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & start the stack
        run: |
          docker compose build api web
          docker compose up -d postgres api web

      - name: Wait for API health
        run: |
          for _ in $(seq 1 60); do
            if curl -fs http://127.0.0.1:8000/v1/health > /dev/null; then
              echo "API is healthy"; exit 0
            fi
            sleep 2
          done
          docker compose logs --no-color
          exit 1

      - name: Verify Web is rendering API status
        run: |
          for _ in $(seq 1 30); do
            if curl -fs http://127.0.0.1:3000/ | grep -q 'API: ok'; then
              echo "Web is rendering API: ok"; exit 0
            fi
            sleep 2
          done
          docker compose logs --no-color
          exit 1

      - name: Tear down
        if: always()
        run: docker compose down -v
