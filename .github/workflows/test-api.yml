name: Backend Tests

on:
  workflow_dispatch:

concurrency:
  group: test-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.11"
          enable-cache: true
      - run: uv sync --frozen --package jobcopilot-api --extra dev
      - run: |
          uv run pytest apps/api/tests \
            -v \
            --cov \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=70
