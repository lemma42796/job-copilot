name: Backend Tests

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/test-api.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/test-api.yml"

concurrency:
  group: test-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.11"
          enable-cache: true
      - run: uv sync --package jobcopilot-api --extra dev
      - run: uv run pytest apps/api/tests -v
