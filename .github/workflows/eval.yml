name: Eval Regression

# S6 阶段只手动触发(GitHub Actions UI 点 "Run workflow")。
# M2 数据集扩到 50 条 + Δ ≤ -2pp 比对脚本就位时,把下面的 push / pull_request
# 触发器恢复(注释里保留原 paths 配置)。本地随时可跑 `pnpm eval:jd`。
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths:
  #     - "apps/api/src/jobcopilot_api/agents/**"
  #     - "apps/api/src/jobcopilot_api/llm/**"
  #     - "apps/api/src/jobcopilot_api/prompts/**"
  #     - "evals/**"
  #     - ".github/workflows/eval.yml"
  # pull_request:
  #   paths:
  #     - "apps/api/src/jobcopilot_api/agents/**"
  #     - "apps/api/src/jobcopilot_api/llm/**"
  #     - "apps/api/src/jobcopilot_api/prompts/**"
  #     - "evals/**"
  #     - ".github/workflows/eval.yml"

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jd_extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Check eval API key
        id: keycheck
        env:
          KEY: ${{ secrets.DASHSCOPE_API_KEY_EVAL }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::warning::DASHSCOPE_API_KEY_EVAL secret not set — eval skipped. See evals/README.md."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.keycheck.outputs.skip == 'false'
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        if: steps.keycheck.outputs.skip == 'false'
        with:
          node-version: 20
          cache: pnpm

      - name: Install evals workspace
        if: steps.keycheck.outputs.skip == 'false'
        run: pnpm install --filter @jobcopilot/evals... --frozen-lockfile

      - name: Run jd_extract suite
        if: steps.keycheck.outputs.skip == 'false'
        env:
          DASHSCOPE_API_KEY_EVAL: ${{ secrets.DASHSCOPE_API_KEY_EVAL }}
        run: pnpm --filter @jobcopilot/evals run eval:jd

      - uses: actions/upload-artifact@v4
        if: always() && steps.keycheck.outputs.skip == 'false'
        with:
          name: jd-extract-report
          path: evals/reports/jd_extract/latest.json
          if-no-files-found: warn
          retention-days: 14

  profile_extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Check eval API key
        id: keycheck
        env:
          KEY: ${{ secrets.DASHSCOPE_API_KEY_EVAL }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::warning::DASHSCOPE_API_KEY_EVAL secret not set — eval skipped. See evals/README.md."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.keycheck.outputs.skip == 'false'
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        if: steps.keycheck.outputs.skip == 'false'
        with:
          node-version: 20
          cache: pnpm

      - name: Install evals workspace
        if: steps.keycheck.outputs.skip == 'false'
        run: pnpm install --filter @jobcopilot/evals... --frozen-lockfile

      - name: Run profile_extract suite
        if: steps.keycheck.outputs.skip == 'false'
        env:
          DASHSCOPE_API_KEY_EVAL: ${{ secrets.DASHSCOPE_API_KEY_EVAL }}
        run: pnpm --filter @jobcopilot/evals run eval:profile

      - uses: actions/upload-artifact@v4
        if: always() && steps.keycheck.outputs.skip == 'false'
        with:
          name: profile-extract-report
          path: evals/reports/profile_extract/latest.json
          if-no-files-found: warn
          retention-days: 14
