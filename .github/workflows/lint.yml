name: Lint & TypeCheck

on:
  workflow_dispatch:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: ruff + mypy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.11"
          enable-cache: true
      - name: Install API project
        run: uv sync --frozen --package jobcopilot-api --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy apps/api/src apps/api/tests

  web:
    name: biome + tsc
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm --filter @jobcopilot/web typecheck
      - run: pnpm --filter @jobcopilot/schemas typecheck

  model-id-lint:
    name: stale model id check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Forbid stale Qwen model IDs (see STATUS.md 永久约束 19)
        run: |
          set -e
          if grep -rEn "qwen[0-9.\-]*vl[a-z\-]*|qwen-vl|qwen-plus|qwen-flash|qwen-max" \
              --include="*.py" --include="*.md" --include="*.ts" --include="*.tsx" \
              --include="*.yaml" --include="*.yml" --include="*.json" \
              --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=.venv \
              --exclude-dir=__pycache__ --exclude-dir=slices \
              --exclude=STATUS.md --exclude=lint.yml \
              .; then
            echo "::error::发现过时模型 ID。项目唯一模型是 qwen3.8-flash(详见 STATUS.md 永久约束 19)。docs/slices/ 已豁免(历史踩坑记录)。"
            exit 1
          fi
